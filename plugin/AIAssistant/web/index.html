<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>STE Slicer AI Assistant</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <h1>STE Slicer AI</h1>
        <span id="status-badge" class="badge">Проверка...</span>
      </div>

      <section class="card">
        <h2>Состояние среды</h2>
        <div class="kv"><span>Принтер:</span><strong id="st-printer">—</strong></div>
        <div class="kv"><span>Режим:</span><strong id="st-mode">—</strong></div>
        <div class="kv"><span>Профиль:</span><strong id="st-quality">—</strong></div>
        <div class="kv"><span>Материал:</span><strong id="st-material">—</strong></div>
        <div class="kv"><span>Высота слоя:</span><strong id="st-layer">—</strong></div>
      </section>

      <section class="card">
        <h2>Настройки LLM</h2>
        <label>Base URL
          <input type="text" id="cfg-url" placeholder="https://api.timeweb.ai/v1">
        </label>
        <label>Модель
          <input type="text" id="cfg-model" placeholder="dashscope/qwen3.8-flash">
        </label>
        <label>API Key <small id="cfg-key-indicator">(не задан)</small>
          <input type="password" id="cfg-key" placeholder="Оставьте пустым, чтобы сохранить текущий">
        </label>
        <div class="btn-row">
          <button id="btn-save-cfg" class="btn primary">Сохранить</button>
          <button id="btn-clear-key" class="btn danger">Очистить ключ</button>
        </div>
      </section>

      <section class="card">
        <h2>Быстрые проверки</h2>
        <button class="chip" data-prompt="Прочитай текущую высоту слоя layer_height.">Прочитать layer_height</button>
        <button class="chip" data-prompt="Установи высоту слоя layer_height равной 0.12 мм и подтверди изменение.">Установить слой 0.12 мм</button>
        <button class="chip" data-prompt="Переключи режим печати в 5D Spiral (cylindrical).">Включить 5D Spiral</button>
        <button class="chip" data-prompt="Что ты умеешь и какие инструменты тебе доступны?">Что умеешь?</button>
      </section>
    </aside>

    <main class="chat-panel">
      <header class="chat-header">
        <div>
          <strong>Диалог с ИИ-технологом</strong>
          <span id="agent-state-text" class="sub">Ожидание запроса</span>
        </div>
        <button id="btn-new-session" class="btn">Новый диалог</button>
      </header>

      <div id="messages" class="messages"></div>

      <form id="chat-form" class="chat-input-bar">
        <textarea id="chat-input" rows="2" placeholder="Опишите задачу (например: Установи высоту слоя 0.12 мм или выбери режим 5D)..."></textarea>
        <button type="submit" id="btn-send" class="btn primary">Отправить</button>
      </form>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
